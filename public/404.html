<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Flow</title>
    <script>
      // GitHub Pages SPA fallback: rewrite unknown paths back to the app's
      // index.html so client-side routing (e.g. /Flow.web/user.name.no.flw)
      // works on refresh. The app base is the first path segment on
      // *.github.io project sites, or "/" on user sites / custom domains.
      (function () {
        var segments = location.pathname.split('/').filter(Boolean);
        var isProjectSite = /\.github\.io$/.test(location.hostname) && segments.length > 0;
        var base = isProjectSite ? '/' + segments[0] + '/' : '/';
        var rest = isProjectSite ? segments.slice(1) : segments;
        var qs = location.search ? location.search : '';
        var hash = location.hash ? location.hash : '';
        if (rest.length) {
          location.replace(
            location.origin +
              base +
              'index.html' +
              '?p=' +
              encodeURIComponent(rest.join('/')) +
              (qs ? '&' + qs.slice(1) : '') +
              hash
          );
        } else {
          location.replace(location.origin + base + 'index.html' + qs + hash);
        }
      })();
    </script>
  </head>
  <body>
    <p>Redirecting to Flow…</p>
  </body>
</html>
